<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Escuela LatinPyme</title>
    <meta name="description" content="Accede a la plataforma de automatización e inteligencia artificial de la Escuela LatinPyme.">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red:       #E30613;
            --red-dark:  #a8030c;
            --red-light: #F97F76;
            --bg:        #0f0f13;
            --card:      #1a1a22;
            --border:    rgba(255,255,255,0.08);
            --text:      #f1f1f1;
            --muted:     #8b8b9a;
            --input-bg:  #12121a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Fondo animado ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(227,6,19,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(169,3,12,0.12) 0%, transparent 55%);
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            from { opacity: 0.7; }
            to   { opacity: 1;   }
        }

        /* ── Partículas decorativas ── */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--red);
            opacity: 0;
            animation: float linear infinite;
        }
        @keyframes float {
            0%   { opacity: 0; transform: translateY(100vh) scale(0); }
            10%  { opacity: 0.3; }
            90%  { opacity: 0.1; }
            100% { opacity: 0; transform: translateY(-20px) scale(1); }
        }

        /* ── Card principal ── */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow:
                0 0 0 1px rgba(227,6,19,0.1),
                0 24px 80px rgba(0,0,0,0.6),
                0 0 80px rgba(227,6,19,0.05);
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(32px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 32px;
        }
        .logo-inner {
            background: white;
            border-radius: 16px;
            padding: 12px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .logo-inner img {
            height: 44px;
            width: auto;
            display: block;
        }

        /* ── Heading ── */
        .login-title {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }
        .login-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 32px;
        }

        /* ── Alertas flash ── */
        .flash-msg {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .flash-error   { background: rgba(227,6,19,0.15); border: 1px solid rgba(227,6,19,0.3); color: #ff8080; }
        .flash-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        /* ── Formulario ── */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .input-wrap {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.2s;
        }
        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 14px 13px 40px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(227,6,19,0.15);
        }
        .form-input:focus + .input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--red-light);
        }
        /* Toggle contraseña */
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 0.9rem;
            padding: 0;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--text); }

        /* ── Remember ── */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
        }
        .remember-row input[type="checkbox"] {
            accent-color: var(--red);
            width: 16px; height: 16px;
            cursor: pointer;
        }
        .remember-row label {
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        /* ── Botón submit ── */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 20px rgba(227,6,19,0.35);
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(227,6,19,0.45);
        }
        .btn-login:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .login-footer strong { color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Card de Login -->
    <div class="login-card" role="main">

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-inner">
                <img src="{{ url_for('static', filename='img/logo_latinpyme.png') }}"
                     alt="Escuela LatinPyme">
            </div>
        </div>

        <!-- Títulos -->
        <div class="login-title">
            <h1>Bienvenido de vuelta</h1>
        </div>
        <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash-msg flash-{{ category }}" role="alert">
                    <i class="fa-solid {% if category == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                    {{ msg }}
                </div>
            {% endfor %}
        {% endwith %}

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.login_post') }}" autocomplete="on" novalidate>

            <!-- Usuario -->
            <div class="form-group">
                <label class="form-label" for="login-username">Usuario</label>
                <div class="input-wrap">
                    <input
                        id="login-username"
                        class="form-input"
                        type="text"
                        name="username"
                        placeholder="tu_usuario"
                        autocomplete="username"
                        required
                        autofocus>
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label class="form-label" for="login-password">Contraseña</label>
                <div class="input-wrap">
                    <input
                        id="login-password"
                        class="form-input"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required>
                    <i class="fa-solid fa-lock input-icon"></i>
                    <button type="button" class="toggle-pw" id="toggle-pw-btn" aria-label="Mostrar contraseña">
                        <i class="fa-solid fa-eye" id="pw-eye-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Recordarme -->
            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Mantener sesión iniciada</label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-login" id="btn-login-submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Ingresar
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            <strong>Escuela LatinPyme</strong> · Plataforma de Gestión IA<br>
            v1.2 Premium LMS
        </div>
    </div>

    <script>
        // ── Toggle visibilidad contraseña ──
        const toggleBtn = document.getElementById('toggle-pw-btn');
        const pwInput   = document.getElementById('login-password');
        const pwIcon    = document.getElementById('pw-eye-icon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            pwIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // ── Animación de carga en submit ──
        document.querySelector('form').addEventListener('submit', function () {
            const btn = document.getElementById('btn-login-submit');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
            btn.disabled = true;
        });

        // ── Partículas de fondo ──
        const container = document.getElementById('particles');
        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.cssText = `
                width: ${size}px; height: ${size}px;
                left: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 12 + 8}s;
                animation-delay: ${Math.random() * 5}s;
                opacity: 0;
            `;
            container.appendChild(p);
            setTimeout(() => p.remove(), 20000);
        }
        for (let i = 0; i < 20; i++) createParticle();
        setInterval(createParticle, 1200);
    </script>
</body>
</html>
